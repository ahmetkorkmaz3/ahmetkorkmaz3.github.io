{% assign icon_kind = include.kind | downcase %}
<svg class="use-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% case icon_kind %}
  {% when 'laptop' %}<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>
  {% when 'keyboard' %}<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>
  {% when 'trackpad' %}<rect x="4" y="5" width="16" height="14" rx="2.5"/>
  {% when 'monitor' %}<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/>
  {% when 'monitor arm' %}<path d="M4 21h6M7 21v-5l6-5 4 2M17 6v12"/><circle cx="7" cy="16" r="1"/><circle cx="13" cy="11" r="1"/>
  {% when 'stand' %}<path d="M5 6l12 9M4 20h16M8 20l9-5"/>
  {% when 'tablet' %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/>
  {% when 'phone' %}<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 5h2"/>
  {% when 'charger' %}<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/>
  {% when 'earbuds' %}<rect x="4" y="9" width="16" height="10" rx="4"/><path d="M4 13h16"/>
  {% when 'lamp' %}<path d="M9 3h6l3 6H6zM12 9v10M8 21h8"/>
  {% when '3d printer' %}<path d="M4 3h16v18H4zM4 7h16M10 7v4l2 2 2-2V7M7 18h10"/>
  {% else %}<circle cx="12" cy="12" r="8"/>
  {% endcase %}
</svg>
